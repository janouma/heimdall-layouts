<!DOCTYPE html>
<html lang="en">
  <head></head>
  <body>
    <script type="module">
      import { isTestEnv } from '../../../../helpers/env.js'
      import { mockApiResponse, mockMathRandom } from '../../../../helpers/api.js'
      import renderLayout from '../../../../helpers/layout.js'

      if (isTestEnv()) {
        mockMathRandom(0.2, 0.5, 0.7)
      }

      const { default: { tmdbApi } } = await import(
        new URL('project.development.config.js', location.origin)
      ).catch(() => ({ default: {} }))

      await navigator.serviceWorker.register(
        'tmdb_pathes_interceptor.js',
        {
          scope: location.pathname,
          type: 'module'
        }
      )

      const service = await navigator.serviceWorker.ready

      if (service.active) {
        service.active.postMessage({ type: 'TMDB_API', payload: tmdbApi })
      }

      const { default: items } =
        await import( '../../../../fixtures/watch/items.json', { with: { type: 'json' } })

      const multipliedItems = Array.from({ length: 230 })
        .map((_, index) => {
          const selectedIndex = index % items.length
          return items[selectedIndex]
        })

      mockApiResponse({
        url: '/api/find-items',

        payload (_, options) {
          const { text: query, offset, max } = (options?.body && JSON.parse(options.body)) || {}
          const tagFreeQuery = query?.replace('"to watch"', '').trim()

          if (tagFreeQuery) {
            const lowercaseQuery = tagFreeQuery.toLowerCase()
            return items.filter(item => item.title?.toLowerCase().includes(lowercaseQuery))
          }

          return multipliedItems.slice(offset, max)
        }
      })

      mockApiResponse({
        url: '/api/count-items',
        payload: multipliedItems.length
      })

      mockApiResponse({
        url: '/api/get-config/watch',

        payload: {
          playlists: {
            'watch sequence': {
              movie: ['under_the_skin', 'the_astronaut', 'the_summit_of_the_gods', 'luther_fallen_sun', 'unknown_poster_id']
            },
            rewatch: {
              movie: ['top_gun_maverick', 'eyes_wide_shut']
            },
            'backup series': {
              'tv show': ['blow_out', 'hilda', 'ballerina']
            }
          }
        }
      })

      mockApiResponse({
        url: '/api/lookup-items',

        payload (_, options) {
          const ids = (options?.body && JSON.parse(options.body)) || []

          return ids.map(id => items.find(({ $id }) => id === $id) ||
            (id === 'the_summit_of_the_gods' && {
              $id: 'the_summit_of_the_gods',
              title: 'The summit of the gods',
              url: 'https://tmdb/the_summit_of_the_gods',
              snapshot: '/heimdall-layouts/tests/suites/watch/main/views/assets/images/the_summit_of_the_gods.webp'
            }))
        }
      })

      mockApiResponse({
        url: '/api/save-item',
        payload () { return { $id: 'items/' + Date.now() } }
      })

      mockApiResponse({ url: '/api/set-config/watch' })
      mockApiResponse({ url: '/^/api/remove-item/.*$/' })

      if (!tmdbApi?.key) {
        mockApiResponse({
          url: '/^https://themoviedb.trd-api.heimdallinsight.com/\\d+/configuration$/',

          payload: {
            images: {
              secure_base_url: 'https://image.tmdb.org/t/p/'
            }
          }
        })

        mockApiResponse({
          url: '/^https://themoviedb.trd-api.heimdallinsight.com/\\d+/search/.*$/',

          payload (uri) {
            const { searchParams } = new URL(uri)

            if (searchParams.has('query')) {
              const lowercaseQuery = searchParams.get('query').toLowerCase()
              const filteredItems = items.filter(item => item.title?.toLowerCase().includes(lowercaseQuery))

              return {
                results: filteredItems.map(({ $id, title, snapshot, meta }) => ({
                  id: meta?.externalId || $id,
                  title,
                  poster_path: snapshot,
                  vote_average: meta?.score,
                  overview: meta?.overview,
                  release_date: meta?.date
                })),

                total_results: filteredItems.length
              }
            }

            return {
              results: [],
              total_results: 0
            }
          }
        })

        mockApiResponse({
          url: '/^https://themoviedb.trd-api.heimdallinsight.com/\\d+/(movie|tv)/.+?\\?.*$/',

          payload (uri) {
            const { pathname } = new URL(uri)
            const { id } = pathname.match(/\/(movie|tv)\/(?<id>.+?)\?/)
            const item = items.find(item => item.$id === id)

            return item ? {
              id: item.meta?.externalId || id,
              title: item.title,
              poster_path: item.snapshot,
              vote_average: item.meta?.score,
              overview: item.meta?.overview,
              release_date: item.meta?.date
            } : { id }
          }
        })
      }

      renderLayout('watch')
    </script>
  </body>
</html>
