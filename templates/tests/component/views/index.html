<!DOCTYPE html>
<html lang="en" class="development">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale = 1.0, user-scalable = no, maximum-scale=1.0, viewport-fit=cover">
    <meta charset="utf-8">
    <link rel="stylesheet" href="../../../../index.css">
    <script type="module" src="../../../../../layouts/${__LAYOUT_FOLDER__}/${__COMPONENT_FOLDER__}/index.js"></script>
    <script type="module">
      import { applyParameters } from '../../../../helpers/parameters.js'
      ${['body', 'header'].includes(__COMPONENT_FOLDER__) ? "import * as layoutContext from '../../../../helpers/layout_context.js'" + String.fromCharCode(0x0A) : ''}
      const component = document.createElement('${__COMPONENT_FOLDER__.replaceAll("_", "-")}')

      applyParameters(
        component,
        {
          ${
            ['body', 'header'].includes(__COMPONENT_FOLDER__)
            ? 'layoutContext'
            : "title: '" + __COMPONENT_FOLDER__.replaceAll("_", " ") + "'"
          }
        }
      )

      document.body.appendChild(component)
    </script>

    <style>
      body {
        background-color: rgb(var(--space));
      }
    </style>
  </head>
  <body></body>
</html>
